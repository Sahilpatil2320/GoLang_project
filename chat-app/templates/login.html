<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Go Chat App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <h2>Join a Chat Room</h2>
            <form action="/login" method="POST">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Enter your name" required><br>
                </div>
                <div class="input-group">
                    <input type="text" name="room" placeholder="Enter room name" required><br>
                </div>
                <button type="submit" class="login-button">Join Chat</button>
            </form>
        </div>
    </div>
</body>
</html>
